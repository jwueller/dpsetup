name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The jobs run third-party code (GE-Proton), so the token can only read.
permissions:
  contents: read

jobs:
  build:
    name: Build and test extraction
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          # The version string counts commits, so the history must be complete.
          fetch-depth: 0

      - name: Build
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -DevCmdArguments '-arch=x86 -host_arch=amd64' -SkipAutomaticLocation
          cmake --preset release
          cmake --build out/build/release
          "ZIP=$((Get-Item out/build/release/dpsetup-*.zip).FullName)" >> $env:GITHUB_ENV

      - name: Test extraction
        shell: pwsh
        run: |
          $exe = Get-Item out/build/release/dist/dpsetup-*/redistributable/dpsetup.exe
          $target = Join-Path $env:RUNNER_TEMP extracted
          $p = Start-Process $exe.FullName -ArgumentList "`"$target`"" -Wait -PassThru -NoNewWindow
          'dpsetup.log:'
          Get-Content (Join-Path $exe.DirectoryName dpsetup.log) | ForEach-Object { "  | $_" }
          Get-ChildItem $target
          if ($p.ExitCode -ne 0) { throw "dpsetup.exe exited with $($p.ExitCode)" }

      # Unarchived, so the release zip is the artifact rather than a zip
      # inside the zip that an artifact otherwise is. download-artifact
      # unpacks it again.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP }}
          archive: false

  # The hosted runners are disposable, already elevated, and ship with the
  # DirectPlay feature disabled, so install mode runs for real here.
  install-windows:
    name: Test installation (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifact
      - name: Test installation
        shell: pwsh
        run: |
          $exe = Get-ChildItem $env:RUNNER_TEMP/artifact -Recurse -Filter dpsetup.exe
          ./tests/install-windows.ps1 -Exe $exe.FullName

  install-wine:
    name: Test installation (Wine)
    needs: build
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      WINEDLLOVERRIDES: mscoree,mshtml=
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifact
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 wine64
      - name: Find the exe
        run: echo "EXE=$(find "$RUNNER_TEMP/artifact" -name dpsetup.exe)" >> "$GITHUB_ENV"
      # In the default prefix, which the install test never touches.
      - name: Extract the expected files
        run: |
          xvfb-run -a wine "$EXE" "$(winepath -w "$RUNNER_TEMP/expected")"
          echo 'dpsetup.log:'
          sed 's/^/  | /' "$(dirname "$EXE")/dpsetup.log"
      - name: Test installation
        run: xvfb-run -a sh tests/install-wine.sh "$EXE" "$RUNNER_TEMP/expected"

  # The latest GE-Proton, since Valve publishes no Proton binaries outside
  # Steam and UMU-Proton (closer to Valve's) lags a major version.
  install-proton:
    name: Test installation (Proton)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artifact
      - name: Download Proton
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo GloriousEggroll/proton-ge-custom --pattern '*-x86_64.tar.gz' --pattern '*-x86_64.sha512sum' --dir "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP" && sha512sum -c GE-Proton*-x86_64.sha512sum)
          tar -xzf "$RUNNER_TEMP"/GE-Proton*-x86_64.tar.gz -C "$RUNNER_TEMP"
          proton=$(find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'GE-Proton*')
          cat "$proton/version"
          echo "PROTON=$proton" >> "$GITHUB_ENV"
      - name: Find the exe
        run: echo "EXE=$(find "$RUNNER_TEMP/artifact" -name dpsetup.exe)" >> "$GITHUB_ENV"
      # In a prefix of its own, which the install test never touches.
      - name: Extract the expected files
        env:
          STEAM_COMPAT_DATA_PATH: ${{ runner.temp }}/extraction
          STEAM_COMPAT_CLIENT_INSTALL_PATH: ${{ runner.temp }}/extraction
          WINEDEBUG: -all
        run: |
          mkdir -p "$STEAM_COMPAT_DATA_PATH"
          xvfb-run -a python3 "$PROTON/proton" run "$EXE" "Z:$(echo "$RUNNER_TEMP/expected" | tr / '\\')"
          echo 'dpsetup.log:'
          sed 's/^/  | /' "$(dirname "$EXE")/dpsetup.log"
      - name: Test installation
        run: xvfb-run -a sh tests/install-wine.sh "$EXE" "$RUNNER_TEMP/expected"
