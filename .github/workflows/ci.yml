name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          # The version string counts commits, so the history must be complete.
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build
        run: |
          cmake --preset release
          cmake --build out/build/release

      - name: Extraction mode
        shell: pwsh
        run: |
          $exe = Get-Item out/build/release/dist/dpsetup-*/redistributable/dpsetup.exe
          $target = Join-Path $env:RUNNER_TEMP extracted
          $p = Start-Process $exe.FullName -ArgumentList "`"$target`"" -Wait -PassThru -NoNewWindow
          Get-Content (Join-Path $exe.DirectoryName dpsetup.log)
          Get-ChildItem $target
          if ($p.ExitCode -ne 0) { throw "dpsetup.exe exited with $($p.ExitCode)" }

      - uses: actions/upload-artifact@v5
        with:
          name: dpsetup
          path: out/build/release/dpsetup-*.zip

  # The hosted runners are disposable, already elevated, and ship with the
  # DirectPlay feature disabled, so install mode runs for real here.
  install-windows:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dpsetup
      - name: Install mode
        shell: pwsh
        run: |
          Expand-Archive dpsetup-*.zip -DestinationPath $env:RUNNER_TEMP/dist
          $exe = Get-ChildItem $env:RUNNER_TEMP/dist -Recurse -Filter dpsetup.exe
          ./tests/windows-install.ps1 -Exe $exe.FullName

  install-wine:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dpsetup
      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine32:i386 wine64
      - name: Install mode
        run: |
          unzip -q dpsetup-*.zip -d "$RUNNER_TEMP/dist"
          xvfb-run -a sh tests/wine-install.sh "$(find "$RUNNER_TEMP/dist" -name dpsetup.exe)"
